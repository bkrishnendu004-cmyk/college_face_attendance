<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · College Attendance System</title><link rel="stylesheet" href="css/style.css"></head>
<body class="login-body">
<form class="login-card" id="f">
<div class="logo">🎓</div><h2>College Attendance System</h2><p class="muted">AI Face Recognition · Sign in to continue</p>
<label class="fld"><span>Email</span><input type="email" id="email" required autocomplete="username"></label>
<label class="fld"><span>Password</span><div class="pw"><input type="password" id="pw" required autocomplete="current-password"><button type="button" id="eye" class="btn ghost sm">Show</button></div></label>
<p id="err" class="errtxt"></p>
<button class="btn primary block" id="go">Login</button>
<button type="button" class="link" id="forgot">Forgot password?</button>
</form>
<script type="module" src="js/login.js"></script></body></html>
